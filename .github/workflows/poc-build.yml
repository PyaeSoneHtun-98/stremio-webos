name: Embedded Subtitle POC

on:
  push:
    branches:
      - feat/issue-1-embedded-subtitle-cue-poc
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS CLI
        run: npm install -g @webosose/ares-cli

      - name: Build and package POC
        run: make package

      - name: Test generated player in real Chromium
        run: |
          npm install --prefix .work/browser-tests --no-save --package-lock=false playwright@1.62.1
          .work/browser-tests/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$PWD/.work/browser-tests/node_modules" node scripts/test-webos-browser-playback.js service/www/video.chunk.js

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: stremio-webos-embedded-subtitle-poc
          path: '*_all.ipk'
          if-no-files-found: error
